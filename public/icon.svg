<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    
    <!-- Quadrant 1: Saffron Sovereign Authority -->
    <linearGradient id="saffron-facet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9933" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    
    <!-- Quadrant 2: Forest & Land Cadastre (Emerald) -->
    <linearGradient id="emerald-facet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Quadrant 3: National Infrastructure & Corridors (Gold / Amber) -->
    <linearGradient id="amber-facet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Quadrant 4: Geographic Survey / PostGIS Sky (Cyan / Blue) -->
    <linearGradient id="blue-facet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Center Vajra Core Glow -->
    <linearGradient id="vajra-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="50%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Container -->
  <rect width="180" height="180" rx="40" fill="url(#bg-grad)" stroke="#1E293B" stroke-width="3" />

  <!-- Outer Cadastral Grid Halo -->
  <circle cx="90" cy="90" r="70" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6" />
  <circle cx="90" cy="90" r="54" stroke="#475569" stroke-width="1" opacity="0.4" />

  <!-- Interlocking Cadastral Diamond Facets (Vajra + Bhoomi Geometry) -->
  <g transform="translate(90, 90)">
    <!-- Top-North Parcel: Statutory Authority (Saffron) -->
    <path d="M 0,-68 L 48,-20 L 16,-16 L 0,-24 Z" fill="url(#saffron-facet)" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1" />
    
    <!-- Top-East Parcel: Geospatial & Infrastructure (Amber) -->
    <path d="M 0,-68 L -48,-20 L -16,-16 L 0,-24 Z" fill="url(#amber-facet)" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1" />

    <!-- Bottom-East Parcel: Green Agriculture & Eco Zone (Emerald) -->
    <path d="M -48,-20 L 0,68 L 0,24 L -16,16 Z" fill="url(#emerald-facet)" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1" />

    <!-- Bottom-West Parcel: Blue Survey & Waters (Azure Blue) -->
    <path d="M 48,-20 L 0,68 L 0,24 L 16,16 Z" fill="url(#blue-facet)" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1" />

    <!-- Wing Flanges (Vajra Thunderbolt Prongs) -->
    <path d="M -68,0 L -20,-48 L -16,-16 L -24,0 Z" fill="url(#amber-facet)" fill-opacity="0.9" />
    <path d="M 68,0 L 20,-48 L 16,-16 L 24,0 Z" fill="url(#saffron-facet)" fill-opacity="0.9" />
    <path d="M -68,0 L -20,48 L -16,16 L -24,0 Z" fill="url(#emerald-facet)" fill-opacity="0.9" />
    <path d="M 68,0 L 20,48 L 16,16 L 24,0 Z" fill="url(#blue-facet)" fill-opacity="0.9" />

    <!-- Central Diamond (The Indestructible Vajra Core) -->
    <polygon points="0,-22 22,0 0,22 -22,0" fill="url(#vajra-gold)" stroke="#FFFFFF" stroke-width="2" filter="url(#glow)" />

    <!-- Inner Core Jewel -->
    <polygon points="0,-12 12,0 0,12 -12,0" fill="#0F172A" />
    <circle cx="0" cy="0" r="4.5" fill="#FBBF24" />
    
    <!-- Fine Cadastral Crosshair Coordinates -->
    <line x1="-10" y1="0" x2="10" y2="0" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" />
    <line x1="0" y1="-10" x2="0" y2="10" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" />
  </g>
</svg>